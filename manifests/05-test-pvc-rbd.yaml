apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-rbd-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: ocs-storagecluster-ceph-rbd
---
apiVersion: v1
kind: Pod
metadata:
  name: test-rbd-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: registry.redhat.io/ubi9/ubi-minimal:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Writing test data to Ceph RBD..."
          echo "ODF Verification - Ceph RBD on odf-network: $(date)" > /mnt/storage/test.txt
          sync
          echo "Reading test data back:"
          cat /mnt/storage/test.txt
          echo "RBD TEST SUCCESS"
      volumeMounts:
        - mountPath: /mnt/storage
          name: rbd-vol
  volumes:
    - name: rbd-vol
      persistentVolumeClaim:
        claimName: test-rbd-pvc
